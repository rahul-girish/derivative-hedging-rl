[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-hedging-rl"
version = "0.1.0"
description = "A modular reinforcement learning framework for intelligent derivative hedging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Your Name" }
]

dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

####################################################
# Black
####################################################

[tool.black]
line-length = 88
target-version = ["py311"]

####################################################
# Ruff
####################################################

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

####################################################
# Pytest
####################################################

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

####################################################
# Coverage
####################################################

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true